<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" width="1440" height="940" role="img" aria-label="Arquitetura do PokerStudio Replayer: navegador com parser em Web Worker e biblioteca local em IndexedDB, API Fastify em camadas sobre PostgreSQL, e o acesso restrito do coach por link e senha.">
  <defs>
    <marker id="aArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#14141a"/>
    </marker>
  </defs>
  <rect width="1440" height="940" fill="#ffffff"/>
  <text x="40" y="44" font-size="21" font-weight="700" fill="#14141a">PokerStudio Replayer — arquitetura</text>
  <text x="40" y="66" font-size="12" fill="#5b5b6b">Monorepo npm workspaces · o histórico de mãos é lido e reproduzido no navegador; o servidor guarda conta, review e avaliações</text>

  <g>
    <rect x="40" y="92" width="560" height="520" rx="10" fill="#f7f9fd" stroke="#c3cfe6" stroke-dasharray="6 4" stroke-width="1.2"/>
    <text x="54" y="112" font-size="12" font-weight="700" fill="#5b5b6b">Navegador do jogador</text>
  </g>
  <g>
    <rect x="60" y="126" width="520" height="92" rx="7" fill="#ffffff" stroke="#c3cfe6" stroke-width="1.8"/>
    <text x="72" y="148" font-size="12.5" font-weight="700" fill="#14141a">Interface — React 18 + Vite + Tailwind</text>
    <text x="72" y="166" font-size="10.5" fill="#5b5b6b">Biblioteca · Replayer · Skins · Configurações · Admin · Relatórios</text>
    <text x="72" y="181" font-size="10.5" fill="#5b5b6b">i18n em 8 idiomas (i18next) · tour guiado · estado em Zustand</text>
  </g>
  <g>
    <rect x="60" y="234" width="250" height="108" rx="7" fill="#ffffff" stroke="#c3cfe6" stroke-width="1.2"/>
    <text x="72" y="256" font-size="12.5" font-weight="700" fill="#14141a">Renderizadores da mesa</text>
    <text x="72" y="274" font-size="10.5" fill="#5b5b6b">Three.js (R3F) com overlays HTML</text>
    <text x="72" y="289" font-size="10.5" fill="#5b5b6b">SVG como alternativa e fallback</text>
    <text x="72" y="304" font-size="10.5" fill="#5b5b6b">Geometria normalizada compartilhada</text>
  </g>
  <g>
    <rect x="330" y="234" width="250" height="108" rx="7" fill="#ffffff" stroke="#c3cfe6" stroke-width="1.2"/>
    <text x="342" y="256" font-size="12.5" font-weight="700" fill="#14141a">Parser em Web Worker</text>
    <text x="342" y="274" font-size="10.5" fill="#5b5b6b">PokerStars implementado</text>
    <text x="342" y="289" font-size="10.5" fill="#5b5b6b">6 salas reconhecidas, sem gramática</text>
    <text x="342" y="304" font-size="10.5" fill="#5b5b6b">Fora da thread da interface</text>
  </g>
  <g>
    <rect x="60" y="358" width="250" height="96" rx="7" fill="#ffffff" stroke="#c3cfe6" stroke-width="1.2"/>
    <text x="72" y="380" font-size="12.5" font-weight="700" fill="#14141a">IndexedDB (Dexie)</text>
    <text x="72" y="398" font-size="10.5" fill="#5b5b6b">Sessões, mãos e notas locais</text>
    <text x="72" y="413" font-size="10.5" fill="#5b5b6b">Skins e configurações</text>
    <text x="72" y="428" font-size="10.5" fill="#5b5b6b">Funciona sem conta</text>
  </g>
  <g>
    <rect x="330" y="358" width="250" height="96" rx="7" fill="#ffffff" stroke="#c3cfe6" stroke-width="1.2"/>
    <text x="342" y="380" font-size="12.5" font-weight="700" fill="#14141a">localStorage</text>
    <text x="342" y="398" font-size="10.5" fill="#5b5b6b">Último ponto da review</text>
    <text x="342" y="413" font-size="10.5" fill="#5b5b6b">Consentimento e preferências</text>
  </g>
  <g>
    <rect x="60" y="470" width="520" height="74" rx="7" fill="#eef7f0" stroke="#b6d8c1" stroke-width="1.2"/>
    <text x="72" y="492" font-size="12.5" font-weight="700" fill="#14141a">Arquivo .txt do jogador</text>
    <text x="72" y="510" font-size="10.5" fill="#5b5b6b">Lido no dispositivo. Só sobe para o servidor quando o jogador escolhe "salvar na conta".</text>
  </g>

  <g>
    <rect x="660" y="92" width="470" height="700" rx="10" fill="#fdf7f7" stroke="#e8c3c0" stroke-dasharray="6 4" stroke-width="1.2"/>
    <text x="674" y="112" font-size="12" font-weight="700" fill="#5b5b6b">Servidor — Node 24 + Fastify 5</text>
  </g>
  <g>
    <rect x="680" y="126" width="430" height="84" rx="7" fill="#ffffff" stroke="#e8c3c0" stroke-width="1.2"/>
    <text x="692" y="148" font-size="12.5" font-weight="700" fill="#14141a">interface/http — rotas, cookies, CSRF</text>
    <text x="692" y="166" font-size="10.5" fill="#5b5b6b">auth · oauth · twofactor · reviews · skins</text>
    <text x="692" y="181" font-size="10.5" fill="#5b5b6b">admin · usage · feedback · assessments · coach</text>
  </g>
  <g>
    <rect x="680" y="226" width="430" height="84" rx="7" fill="#ffffff" stroke="#e8c3c0" stroke-width="1.2"/>
    <text x="692" y="248" font-size="12.5" font-weight="700" fill="#14141a">application — casos de uso</text>
    <text x="692" y="266" font-size="10.5" fill="#5b5b6b">LoginUser · SignInWithProvider · CloudReviews</text>
    <text x="692" y="281" font-size="10.5" fill="#5b5b6b">Assessments · CoachInvites · ManageUsers · Feedback</text>
  </g>
  <g>
    <rect x="680" y="326" width="430" height="68" rx="7" fill="#ffffff" stroke="#e8c3c0" stroke-width="1.2"/>
    <text x="692" y="348" font-size="12.5" font-weight="700" fill="#14141a">domain — entidades e erros</text>
    <text x="692" y="366" font-size="10.5" fill="#5b5b6b">User · Result&lt;T, AppError&gt; · catálogo de erros</text>
  </g>
  <g>
    <rect x="680" y="410" width="430" height="84" rx="7" fill="#ffffff" stroke="#e8c3c0" stroke-width="1.2"/>
    <text x="692" y="432" font-size="12.5" font-weight="700" fill="#14141a">infrastructure — adaptadores</text>
    <text x="692" y="450" font-size="10.5" fill="#5b5b6b">Prisma · argon2id · AES-256-GCM · otplib</text>
    <text x="692" y="465" font-size="10.5" fill="#5b5b6b">OIDC (Google, Facebook, Apple) · e-mail · GeoIP</text>
  </g>
  <g>
    <rect x="680" y="510" width="430" height="74" rx="7" fill="#fdeceb" stroke="#e8c3c0" stroke-width="1.8"/>
    <text x="692" y="532" font-size="12.5" font-weight="700" fill="#14141a">packages/shared — regras de cálculo</text>
    <text x="692" y="550" font-size="10.5" fill="#5b5b6b">Score, cobertura VPIP, leaks, rubrica, senha do coach</text>
    <text x="692" y="565" font-size="10.5" fill="#5b5b6b">Mesmo código na interface e no servidor</text>
  </g>
  <g>
    <rect x="680" y="600" width="430" height="78" rx="7" fill="#ffffff" stroke="#e8c3c0" stroke-width="1.2"/>
    <text x="692" y="622" font-size="12.5" font-weight="700" fill="#14141a">Composition root — main-container.ts</text>
    <text x="692" y="640" font-size="10.5" fill="#5b5b6b">Uma única montagem de dependências</text>
    <text x="692" y="655" font-size="10.5" fill="#5b5b6b">Provedor social só existe quando configurado</text>
  </g>
  <g>
    <rect x="680" y="694" width="430" height="74" rx="7" fill="#f6f1fa" stroke="#cdbede" stroke-width="1.8"/>
    <text x="692" y="716" font-size="12.5" font-weight="700" fill="#14141a">PostgreSQL 16</text>
    <text x="692" y="734" font-size="10.5" fill="#5b5b6b">25 tabelas · migrações versionadas pelo Prisma</text>
    <text x="692" y="749" font-size="10.5" fill="#5b5b6b">Base de desenvolvimento e base de teste separadas</text>
  </g>

  <g>
    <rect x="1190" y="92" width="210" height="380" rx="10" fill="#fafafa" stroke="#d8d8e0" stroke-dasharray="6 4" stroke-width="1.2"/>
    <text x="1204" y="112" font-size="12" font-weight="700" fill="#5b5b6b">Serviços externos</text>
  </g>
  <g>
    <rect x="1206" y="126" width="178" height="66" rx="7" fill="#ffffff" stroke="#d8d8e0" stroke-width="1.2"/>
    <text x="1218" y="148" font-size="12.5" font-weight="700" fill="#14141a">Google · Facebook</text>
    <text x="1218" y="166" font-size="10.5" fill="#5b5b6b">OAuth 2.0 / OIDC</text>
    <text x="1218" y="181" font-size="10.5" fill="#5b5b6b">PKCE e appsecret_proof</text>
  </g>
  <g>
    <rect x="1206" y="208" width="178" height="66" rx="7" fill="#ffffff" stroke="#d8d8e0" stroke-width="1.2"/>
    <text x="1218" y="230" font-size="12.5" font-weight="700" fill="#14141a">Apple</text>
    <text x="1218" y="248" font-size="10.5" fill="#5b5b6b">Sign in with Apple</text>
    <text x="1218" y="263" font-size="10.5" fill="#5b5b6b">client secret ES256</text>
  </g>
  <g>
    <rect x="1206" y="290" width="178" height="58" rx="7" fill="#ffffff" stroke="#d8d8e0" stroke-width="1.2"/>
    <text x="1218" y="312" font-size="12.5" font-weight="700" fill="#14141a">Provedor de e-mail</text>
    <text x="1218" y="330" font-size="10.5" fill="#5b5b6b">Resend ou SMTP</text>
  </g>
  <g>
    <rect x="1206" y="364" width="178" height="58" rx="7" fill="#ffffff" stroke="#d8d8e0" stroke-width="1.2"/>
    <text x="1218" y="386" font-size="12.5" font-weight="700" fill="#14141a">Turnstile · MaxMind</text>
    <text x="1218" y="404" font-size="10.5" fill="#5b5b6b">Anti-bot e país</text>
  </g>

  <g>
    <rect x="40" y="640" width="560" height="200" rx="10" fill="#f6f1fa" stroke="#cdbede" stroke-dasharray="6 4" stroke-width="1.2"/>
    <text x="54" y="660" font-size="12" font-weight="700" fill="#5b5b6b">Acesso restrito do coach</text>
  </g>
  <g>
    <rect x="60" y="674" width="250" height="146" rx="7" fill="#ffffff" stroke="#cdbede" stroke-width="1.2"/>
    <text x="72" y="696" font-size="12.5" font-weight="700" fill="#14141a">Link + senha</text>
    <text x="72" y="714" font-size="10.5" fill="#5b5b6b">Token imprevisível na URL</text>
    <text x="72" y="729" font-size="10.5" fill="#5b5b6b">Senha de 8 caracteres, só o hash</text>
    <text x="72" y="744" font-size="10.5" fill="#5b5b6b">Cookie próprio, escopo de uma review</text>
    <text x="72" y="759" font-size="10.5" fill="#5b5b6b">Prazo e revogação verificados</text>
    <text x="72" y="774" font-size="10.5" fill="#5b5b6b">a cada requisição</text>
  </g>
  <g>
    <rect x="330" y="674" width="250" height="146" rx="7" fill="#ffffff" stroke="#cdbede" stroke-width="1.2"/>
    <text x="342" y="696" font-size="12.5" font-weight="700" fill="#14141a">O que o coach vê</text>
    <text x="342" y="714" font-size="10.5" fill="#5b5b6b">Replayer da sessão avaliada</text>
    <text x="342" y="729" font-size="10.5" fill="#5b5b6b">Notas, tags, comentários e OK</text>
    <text x="342" y="744" font-size="10.5" fill="#5b5b6b">Progresso e conclusão</text>
    <text x="342" y="759" font-size="10.5" fill="#5b5b6b">—</text>
    <text x="342" y="774" font-size="10.5" fill="#5b5b6b">Não vê biblioteca, importação, skins,</text>
    <text x="342" y="789" font-size="10.5" fill="#5b5b6b">administração nem outras avaliações</text>
  </g>

  <path d="M580 172 L680 172" fill="none" stroke="#14141a" stroke-width="1.4" marker-end="url(#aArrow)"/>
  <text x="630" y="150" font-size="10" fill="#5b5b6b" text-anchor="middle">HTTPS · JSON · cookie de sessão</text>
  <path d="M580 507 H634 V250 H680" fill="none" stroke="#14141a" stroke-width="1.4" marker-end="url(#aArrow)"/>
  <text x="636" y="470" font-size="10" fill="#5b5b6b" text-anchor="middle">salvar review na conta</text>
  <path d="M580 745 H620 V168 H680" fill="none" stroke="#c81d16" stroke-width="1.4" marker-end="url(#aArrow)"/>
  <text x="622" y="640" font-size="10" fill="#c81d16" text-anchor="middle">token + senha</text>
  <path d="M1110 452 H1160 V160 H1206" fill="none" stroke="#14141a" stroke-width="1.4" marker-end="url(#aArrow)"/>
  <text x="1162" y="300" font-size="10" fill="#5b5b6b" text-anchor="middle">código ↔ token</text>
  <path d="M1110 452 H1176 V320 H1206" fill="none" stroke="#14141a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#aArrow)"/>
  <text x="1178" y="400" font-size="10" fill="#5b5b6b" text-anchor="middle">envio de e-mail</text>
  <path d="M895 584 L895 694" fill="none" stroke="#14141a" stroke-width="1.4" marker-end="url(#aArrow)"/>
  <text x="895" y="632" font-size="10" fill="#5b5b6b" text-anchor="middle">consultas e migrações</text>
  <path d="M895 494 L895 510" fill="none" stroke="#14141a" stroke-width="1.4" marker-end="url(#aArrow)"/>
  <text x="895" y="495" font-size="10" fill="#5b5b6b" text-anchor="middle"></text>

  <text x="40" y="880" font-size="11" fill="#5b5b6b">Produção: build estático do web servido por nginx em replayer.pokerstudio.com.br · API e PostgreSQL em Docker no mesmo VPS</text>
  <text x="40" y="900" font-size="11" fill="#5b5b6b">Testes: Vitest — 124 na API (incluindo as regras de avaliação) e 90 no web · suítes da API contra a base de teste, uma por vez</text>
  <text x="40" y="920" font-size="10" fill="#5b5b6b">Gerado do código em 07/09/2026 · pokerstudio.com.br</text>
</svg>
