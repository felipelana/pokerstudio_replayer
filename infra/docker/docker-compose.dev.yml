# Local only. Builds the three images from this working tree instead of pulling
# them from the registry, and publishes the edge proxy's ports straight to the
# host so there is no separate Caddy stack to run.
services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: pokerstudio/api:dev
    ports:
      - '3001:3001'

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: pokerstudio/web:dev
    ports:
      - '8080:80'

  landing:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.landing
    image: pokerstudio/landing:dev
    ports:
      - '8081:80'

networks:
  edge:
    external: false
    name: pokerstudio-edge-dev
