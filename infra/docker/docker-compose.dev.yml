# Local only. Builds the image from this working tree instead of pulling it
# from the registry, and publishes its port straight to the host so there is no
# separate Caddy stack to run.
services:
  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.next
    image: pokerstudio/app:dev
    ports:
      - '3000:3000'

networks:
  edge:
    external: false
    name: pokerstudio-edge-dev
