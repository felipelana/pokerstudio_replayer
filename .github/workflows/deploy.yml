# The one deploy, called twice.
#
# Staging and production differ in four things — the tag on the images, the
# compose overlay, the directory on the server and the address that gets
# checked afterwards — and in nothing else. Keeping them in one file is what
# makes "it worked on staging" mean something.
name: Deploy

on:
  workflow_call:
    inputs:
      app_env:
        description: staging | production
        required: true
        type: string
      image_tag:
        description: The tag every image is published and deployed under.
        required: true
        type: string
      version:
        description: Human-readable release, shown in /health and in the admin footer.
        required: true
        type: string
      project:
        description: Docker Compose project name on the server.
        required: true
        type: string
      overlay:
        description: The per-environment compose file.
        required: true
        type: string
      app_dir:
        description: Where the environment lives on the server.
        required: true
        type: string
      health_url:
        required: true
        type: string
      landing_url:
        required: true
        type: string
      github_environment:
        description: GitHub Environment, which is where a manual approval is configured.
        required: false
        type: string
        default: ''
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true
      VPS_PORT:
        required: false
      STAGING_USER:
        required: false
      STAGING_PASSWORD:
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/Dockerfile.api
          - image: web
            dockerfile: infra/docker/Dockerfile
          - image: landing
            dockerfile: infra/docker/Dockerfile.landing
          # A imagem unica da migracao: a landing, o replayer e a API juntos.
          # E publicada junto das tres antigas para existir no registro quando a
          # virada acontecer. Nada do que sobe hoje muda por causa dela.
          - image: app
            dockerfile: infra/docker/Dockerfile.next
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ inputs.image_tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.app_env }}-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app_env }}-${{ matrix.image }}

  deploy:
    name: Deploy to ${{ inputs.app_env }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    steps:
      # The server keeps the release it is running in its own .env. Writing the
      # new values there — and keeping the old ones in .env.previous — is what
      # makes the rollback below a file copy instead of a guess.
      - name: Release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          envs: APP_DIR,PROJECT,OVERLAY,REGISTRY,REPOSITORY,IMAGE_TAG,VERSION,COMMIT,BUILT_AT,GHCR_ACTOR,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            cp .env .env.previous

            echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_ACTOR" --password-stdin

            set_var() {
              # Replace the line if it exists, append it if it does not.
              grep -q "^$1=" .env && sed -i "s|^$1=.*|$1=$2|" .env || echo "$1=$2" >> .env
            }
            set_var API_IMAGE     "$REGISTRY/$REPOSITORY/api:$IMAGE_TAG"
            set_var WEB_IMAGE     "$REGISTRY/$REPOSITORY/web:$IMAGE_TAG"
            set_var LANDING_IMAGE "$REGISTRY/$REPOSITORY/landing:$IMAGE_TAG"
            set_var APP_VERSION   "$VERSION"
            set_var APP_COMMIT    "$COMMIT"
            set_var APP_BUILT_AT  "$BUILT_AT"

            compose() { docker compose -p "$PROJECT" -f docker-compose.yml -f "$OVERLAY" "$@"; }
            compose pull
            # The API container runs `prisma migrate deploy` before it listens,
            # so the schema and the code that needs it move together.
            compose up -d --remove-orphans
            docker image prune -f
        env:
          APP_DIR: ${{ inputs.app_dir }}
          PROJECT: ${{ inputs.project }}
          OVERLAY: ${{ inputs.overlay }}
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
          BUILT_AT: ${{ github.event.repository.updated_at }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Proof, not hope: the release only stands if the address the public uses
      # answers, and answers with the commit that was just pushed.
      - name: Smoke test
        id: smoke
        run: |
          set -euo pipefail
          auth=()
          if [ -n "${STAGING_USER:-}" ]; then auth=(-u "$STAGING_USER:$STAGING_PASSWORD"); fi

          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "${{ inputs.health_url }}" || true)
            commit=$(printf '%s' "$body" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            if [ "$commit" = "${{ github.sha }}" ]; then
              echo "health ok: $body"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::health never reported ${{ github.sha }} (last answer: ${body:-none})"
              exit 1
            fi
            sleep 5
          done

          code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 10 "${auth[@]}" "${{ inputs.landing_url }}")
          echo "landing answered $code"
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

      # Only reached when the check above failed. The previous .env still names
      # the images that were serving five minutes ago, so putting it back is
      # the whole of the rollback.
      - name: Roll back
        if: failure() && steps.smoke.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          envs: APP_DIR,PROJECT,OVERLAY
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            cp .env.previous .env
            docker compose -p "$PROJECT" -f docker-compose.yml -f "$OVERLAY" up -d
            echo "rolled back to the previous release"
        env:
          APP_DIR: ${{ inputs.app_dir }}
          PROJECT: ${{ inputs.project }}
          OVERLAY: ${{ inputs.overlay }}
